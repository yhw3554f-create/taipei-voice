<title>台北首都戰輿情中心</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one column, election-night scoreboard on top (portraits + AI estimate), then voice data, trends, map, ledger */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --surface-2:#eceff0; --fg:#141c19; --muted:#5b6762; --line:#dce1df;
  --shen:#1d7a4f; --shen-soft:#dcefe4; --chiang:#2a4f9e; --chiang-soft:#e0e8f7;
  --pos:#1d7a4f; --neg:#b3402e; --neu:#8a948f; --pos-solid:#16794a; --neg-solid:#c0392b; --dpp:#1b7a4a; --kmt:#1f3f95;
  --m0:#e6e9e8; --m1:#f3dcb0; --m2:#e8b465; --m3:#c98a2c; --m4:#8f5e14;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --surface:#171e1b; --surface-2:#1f2824; --fg:#e8eeea; --muted:#9aa6a0; --line:#2a3531;
  --shen:#3aa874; --shen-soft:#163327; --chiang:#6a8fe0; --chiang-soft:#1b2640;
  --pos:#4fbf8a; --neg:#e07a68; --neu:#7c8782;
  --m0:#26302c; --m1:#4a3a1c; --m2:#7a5a22; --m3:#b0812f; --m4:#e0ac52; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --surface:#171e1b; --surface-2:#1f2824; --fg:#e8eeea; --muted:#9aa6a0; --line:#2a3531;
  --shen:#3aa874; --shen-soft:#163327; --chiang:#6a8fe0; --chiang-soft:#1b2640;
  --pos:#4fbf8a; --neg:#e07a68; --neu:#7c8782;
  --m0:#26302c; --m1:#4a3a1c; --m2:#7a5a22; --m3:#b0812f; --m4:#e0ac52; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:56px}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-size:22px;font-weight:900;letter-spacing:.02em}
h3{font-size:15px;font-weight:700}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--muted);font-weight:500}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
a{color:inherit;text-decoration-color:var(--line);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
a:focus-visible,button:focus-visible,path:focus-visible{outline:2px solid var(--chiang);outline-offset:2px}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 32px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-size:clamp(22px,4vw,30px);font-weight:900;letter-spacing:.04em}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--neg);box-shadow:0 0 0 0 var(--neg);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--neg) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
.cd{display:flex;gap:18px;align-items:flex-end}
.cd .u{display:flex;flex-direction:column;align-items:center}
.cd b{font-family:var(--mono);font-size:clamp(24px,4.5vw,34px);font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.cd span{font-size:11px;color:var(--muted);letter-spacing:.1em;margin-top:4px}
.cd .lbl{font-size:12px;color:var(--muted);text-align:right;line-height:1.4;align-self:center}

/* hero scoreboard */
.hero{display:grid;grid-template-columns:1fr minmax(300px,1.3fr) 1fr;gap:20px;align-items:stretch}
.port{position:relative;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line)}
.port .photo{background:#fff;flex:1;display:flex;align-items:flex-end;justify-content:center;border-bottom:4px solid}
.port .photo{border-bottom:0}
.port img{display:block;width:100%;height:100%;max-height:380px;object-fit:cover;object-position:center top}
.nameplate{padding:18px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff}
.port.s .nameplate{background:var(--dpp)} .port.c .nameplate{background:var(--kmt)}
.nameplate b{font-size:clamp(30px,3.8vw,44px);font-weight:900;letter-spacing:.14em;line-height:1.2}
.nameplate span{font-size:15px;color:rgba(255,255,255,.88);letter-spacing:.06em}
.ai{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px}
.ai-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:8px}
.score .v{display:flex;flex-direction:column}
.score .v.c{text-align:right}
.score .v b{font-family:var(--mono);font-size:clamp(30px,4.2vw,46px);letter-spacing:-.02em;white-space:nowrap;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.score .v.s b{color:var(--shen)} .score .v.c b{color:var(--chiang)}
.score .v span{font-size:13px;color:var(--muted);margin-top:6px}
.score .mid{font-size:12px;color:var(--muted);padding-bottom:22px}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.split div{height:100%}
.split .s{background:var(--shen);border-radius:6px 0 0 6px} .split .u{background:var(--surface-2)} .split .c{background:var(--chiang);border-radius:0 6px 6px 0}
.und{font-size:12px;color:var(--muted);text-align:center;margin-top:-8px}
.verdict{font-size:17px;font-weight:700;line-height:1.5}
.ai ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.ai .fine{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}

section{display:flex;flex-direction:column;gap:20px}
.sec-head{display:flex;flex-direction:column;gap:4px}
.sec-head.row{flex-direction:row;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;font-weight:500;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--fg)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.sw.s{background:var(--shen)} .sw.c{background:var(--chiang)}
.chart{position:relative;height:260px}
.chart.sm{height:220px}
.donut-wrap{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:center}
.donut{position:relative;height:200px}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-center b{font-family:var(--mono);font-size:26px;font-weight:600}
.donut-center span{font-size:12px;color:var(--muted)}

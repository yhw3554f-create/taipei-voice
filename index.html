<title>競業雷達</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 版面：頂部導覽 + 步驟條，單一主欄，資料以表格與條形圖呈現；冷調白底、青綠為主色 */
:root{
  --bg:#f5f8fa; --surface:#ffffff; --surface-2:#eef3f6; --line:#d9e2e8; --ink:#0f2230; --muted:#5b6e7b;
  --accent:#0a8f8a; --accent-ink:#ffffff; --accent-soft:#dff3f1; --focus:#0a8f8a;
  --red:#d93f3f; --red-soft:#fde8e8; --yellow:#c98a00; --yellow-soft:#fdf3d6; --green:#1f9d55; --green-soft:#e1f5e9;
  --pos:#1f9d55; --neu:#8a9ba8; --neg:#d93f3f;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(15,34,48,.06),0 4px 16px rgba(15,34,48,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c151c; --surface:#121f28; --surface-2:#182833; --line:#24384a; --ink:#e3edf2; --muted:#93a8b6;
  --accent:#2cc4bb; --accent-ink:#04201e; --accent-soft:#123634; --focus:#2cc4bb;
  --red:#f06a6a; --red-soft:#3a1c1e; --yellow:#e8b33a; --yellow-soft:#3a2f12; --green:#4cc684; --green-soft:#14331f;
  --pos:#4cc684; --neu:#6f8493; --neg:#f06a6a; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c151c; --surface:#121f28; --surface-2:#182833; --line:#24384a; --ink:#e3edf2; --muted:#93a8b6;
  --accent:#2cc4bb; --accent-ink:#04201e; --accent-soft:#123634; --focus:#2cc4bb;
  --red:#f06a6a; --red-soft:#3a1c1e; --yellow:#e8b33a; --yellow-soft:#3a2f12; --green:#4cc684; --green-soft:#14331f;
  --pos:#4cc684; --neu:#6f8493; --neg:#f06a6a; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
h2{font-size:1.35rem} h3{font-size:1.05rem}
a{color:var(--accent)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem}
/* 頂部 */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem;letter-spacing:.02em}
.brand svg{flex:none}
.brand small{font-family:var(--f-mono);font-weight:400;color:var(--muted);font-size:.72rem;letter-spacing:.12em}
.env{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.78rem;color:var(--muted);background:var(--surface)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--neu);display:inline-block}
.pill.ok i{background:var(--green)} .pill.bad i{background:var(--red)} .pill.wait i{background:var(--yellow)}
/* 步驟 */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-block:18px 6px;list-style:none;margin:0}
.steps li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--muted);min-width:0}
.steps li b{font-family:var(--f-mono);font-size:.8rem;width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
.steps li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps li.on{border-color:var(--accent);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.steps li.on b{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps li.done b{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.steps li.done{cursor:pointer}
@media (max-width:640px){.steps{grid-template-columns:repeat(4,auto)}.steps li span{display:none}.steps li.on span{display:inline}}
/* 面板 */
main{padding-block:12px 64px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow);display:grid;gap:20px;min-width:0}
.panel-head{display:grid;gap:6px}
.panel-head p{margin:0;color:var(--muted);max-width:68ch}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:grid;gap:6px;min-width:0;flex:1 1 220px}
.field label{font-size:.82rem;color:var(--muted);font-weight:500}
input[type=text],input[type=url],input[type=date],input[type=password],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,.steps li:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.big input{font-size:1.15rem;padding:12px 14px}
button{font:inherit;cursor:pointer;border-radius:8px;padding:9px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;display:inline-flex;align-items:center;gap:6px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.06)}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
button.sm{padding:4px 10px;font-size:.82rem}
button:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.notice{border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);background:var(--surface-2);font-size:.9rem}
.notice.err{border-color:var(--red);background:var(--red-soft)}
.notice.warn{border-color:var(--yellow);background:var(--yellow-soft)}
.notice.info{border-color:var(--accent);background:var(--accent-soft)}
.notice b{display:block;margin-bottom:2px}
/* 選項卡 */
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.choice{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:6px;cursor:pointer;background:var(--surface);position:relative;min-width:0}
.choice:hover{border-color:var(--accent)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice .t{display:flex;gap:8px;align-items:flex-start}
.choice .t input{margin-top:5px;flex:none;accent-color:var(--accent)}
.choice h3{font-size:1rem}
.choice p{margin:0;font-size:.86rem;color:var(--muted);overflow-wrap:anywhere}
.tag{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.site-in{font-size:.82rem;padding:5px 8px}
.hero1{padding-block:48px;justify-items:center}
.q1{display:flex;gap:10px;width:100%;max-width:560px}
.q1 input{font-size:1.2rem;padding:14px 16px;flex:1}
.q1 button{padding-inline:24px;font-size:1.05rem}
.confirm1{width:100%;max-width:560px}
.choice.cand{display:flex;gap:14px;align-items:center;justify-content:space-between;cursor:default;flex-wrap:wrap}
.choice.cand>button{flex:none}
/* 等級徽章 */
.lv{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.lv::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.lv.red{color:var(--red);background:var(--red-soft)} .lv.yellow{color:var(--yellow);background:var(--yellow-soft)} .lv.green{color:var(--green);background:var(--green-soft)} .lv.none{color:var(--muted);background:var(--surface-2)}
.st{font-size:.78rem;padding:1px 8px;border-radius:6px;white-space:nowrap}
.st.positive{color:var(--pos);background:var(--green-soft)} .st.neutral{color:var(--muted);background:var(--surface-2)} .st.negative{color:var(--neg);background:var(--red-soft)}
/* 表格 */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);min-width:0}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-weight:500;color:var(--muted);font-size:.78rem;letter-spacing:.04em;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.cell-ok{color:var(--green);font-weight:500}.cell-err{color:var(--red)}.cell-skip{color:var(--muted)}
.title-cell a{color:var(--ink);text-decoration:none;font-weight:500}
.title-cell a:hover{color:var(--accent);text-decoration:underline}
.title-cell p{margin:2px 0 0;color:var(--muted);font-size:.82rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{width:auto;padding:6px 10px;font-size:.85rem}
/* 進度 */
.progress{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.progress i{transition:none}}
/* 報告 */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface)}
.kpi .v{font-family:var(--f-mono);font-size:1.7rem;font-weight:500;line-height:1.2}
.kpi .l{font-size:.8rem;color:var(--muted)}
.sec{display:grid;gap:12px;min-width:0;align-content:start}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.sec-h .k{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.brief{background:var(--surface-2);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px}
.brief p{margin:0;max-width:75ch}
.brief ul{margin:0;padding-left:1.2em}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(80px,160px) 1fr 52px;gap:10px;align-items:center;font-size:.86rem}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:18px;background:var(--surface-2);border-radius:4px;overflow:hidden;display:flex}
.bar .tr i{display:block;height:100%}
.bar .vv{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.kw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kw span{border:1px solid var(--line);border-radius:999px;padding:3px 12px;background:var(--surface)}
.kw span b{font-family:var(--f-mono);font-weight:500;color:var(--muted);margin-left:6px;font-size:.8em}
.bcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.bcard{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.bcard.red{border-top:3px solid var(--red)} .bcard.yellow{border-top:3px solid var(--yellow)} .bcard.green{border-top:3px solid var(--green)}
.bcard h4{margin:0;font-size:.78rem;color:var(--muted);font-weight:500;letter-spacing:.06em}
.bcard ul{margin:0;padding-left:1.1em;font-size:.88rem}
.bcard .vs{font-size:.88rem;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.self-mark{font-size:.7rem;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:middle}
details.settings{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 14px}
details.settings summary{cursor:pointer;padding:10px 0;font-size:.88rem;color:var(--muted)}
details.settings[open]{padding-bottom:14px}
.linkrow{display:flex;gap:6px;flex-wrap:wrap}
.linkrow a{font-size:.8rem;border:1px solid var(--line);border-radius:6px;padding:2px 8px;text-decoration:none;white-space:nowrap}
.linkrow a:hover{border-color:var(--accent)}
.linkcol{display:grid;gap:4px;justify-items:start}
.linkcol a{font-size:.84rem;white-space:nowrap;text-decoration:none;border-bottom:1px dotted var(--accent)}
.linkcol a:hover{border-bottom-style:solid}
table.hub td{min-width:120px}
.hidden-print{}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="none" stroke="var(--accent)" stroke-width="1.5"/><circle cx="14" cy="14" r="7" fill="none" stroke="var(--accent)" stroke-opacity=".5" stroke-width="1.2"/><path d="M14 14 L24 8" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/><circle cx="20" cy="18" r="2" fill="var(--red)"/><circle cx="9" cy="10" r="1.6" fill="var(--yellow)"/></svg>
      <div>競業雷達 <small>COMPETITIVE RADAR</small></div>
    </div>
    <div class="env" id="env"></div>
  </div>
</header>

<div class="wrap">
  <ol class="steps" id="steps">
    <li data-s="1"><b>1</b><span>確認公司</span></li>
    <li data-s="2"><b>2</b><span>選擇競業</span></li>
    <li data-s="3"><b>3</b><span>蒐集資料</span></li>
    <li data-s="4"><b>4</b><span>分析報告</span></li>
  </ol>
</div>

<main class="wrap">
  <div id="view"></div>
  <details class="settings" id="settings" style="margin-top:16px">
    <summary>連線與 AI 設定</summary>
    <div style="display:grid;gap:12px">
      <p class="small muted" style="margin:0">自動抓取需要在電腦上執行完整版（雙擊 start-windows.bat 或 start-mac.command）。金鑰只存在你的瀏覽器。</p>
      <div class="row">
        <div class="field"><label for="apikey">Anthropic API Key（後端未設定時使用，只存在你的瀏覽器）</label><input type="password" id="apikey" placeholder="sk-ant-..."></div>
        <div class="field"><label for="serperkey">Google 搜尋金鑰（Serper API Key，用來自動搜尋 Google、Facebook、官網）</label><input type="password" id="serperkey" placeholder="從 serper.dev 取得"></div>
        <button id="savekey">儲存</button>
        <button id="reset" class="ghost">清除全部資料重新開始</button>
      </div>
    </div>
  </details>
</main>

<script>
(() => {
'use strict';
// ================= 狀態 =================
const today = new Date();
const iso = d => d.toISOString().slice(0, 10);
const daysAgo = n => iso(new Date(Date.now() - n * 86400000));
const DEFAULT = () => ({
  step: 1, query: { name: '', hint: '' }, candidates: [], company: null,
  competitors: [], from: daysAgo(30), to: iso(today),
  sources: { news: true, newsEn: false, google: true, facebook: true, site: true, youtube: true },
  items: [], log: {}, analysis: {}, report: null, reportAt: null,
});
let S = DEFAULT();
const env = { backend: null, backendAI: false, youtube: false, google: false, sample: null, sampleChecked: false };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const saved = store.get('radar.state'); if (saved && saved.step) { S = Object.assign(DEFAULT(), saved); S.sources = { ...DEFAULT().sources, ...(saved.sources || {}) }; }
const save = () => store.set('radar.state', S);
let userKey = store.get('radar.key') || '';
let serperKey = store.get('radar.serper') || '';
const googleReady = () => !!env.backend && (env.google || !!serperKey);
const namesOf = b => [b.name, ...(b.aliases || [])].map(x => String(x).trim()).filter((x, i, a) => x && a.indexOf(x) === i).slice(0, 4);

// ================= 工具 =================
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; } };
const link = (u, text) => { const s = safeUrl(u); return s ? `<a href="${esc(s)}" target="_blank" rel="noopener noreferrer">${text}</a>` : text; };
const fmtDate = d => d ? new Date(d).toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' }) : '日期不明';
const hash = s => { let h = 2166136261; for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); };
const TYPE = { news: '新聞', google: 'Google 搜尋', facebook: 'Facebook', site: '官網', youtube: 'YouTube', manual: '手動貼上' };
const LV = { red: '紅色・高度相關', yellow: '黃色・需關注', green: '綠色・低相關' };
const LVs = { red: '紅', yellow: '黃', green: '綠' };
const SENT = { positive: '正面', neutral: '中立', negative: '負面' };
const brands = () => S.company ? [{ ...S.company, self: true }, ...S.competitors.filter(c => c.checked)] : [];
const API = '';

async function api(path, opts = {}) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), opts.timeout || 30000);
  try {
    const r = await fetch(API + path, { ...opts, headers: { ...(opts.headers || {}), ...(serperKey ? { 'X-User-Serper-Key': serperKey } : {}) }, signal: ctl.signal });
    const data = await r.json().catch(() => ({ error: `後端回應格式錯誤（HTTP ${r.status}）` }));
    if (!r.ok || data.error) { const e = new Error(data.error || `HTTP ${r.status}`); e.data = data; throw e; }
    return data;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('連線逾時');
    if (e instanceof TypeError) throw new Error('無法連線到後端服務（預覽頁或後端未啟動）');
    throw e;
  } finally { clearTimeout(t); }
}

// ================= AI =================
function aiReady() { return env.backendAI || (env.backend && userKey) || !!env.sample; }
function aiLabel() { return env.backendAI ? '後端 AI' : (env.backend && userKey) ? '你的 API Key' : env.sample ? 'Claude（你的帳號）' : null; }
function parseJSON(text) {
  let t = String(text || '').replace(/```(?:json)?/gi, '').trim();
  const a = t.search(/[[{]/); const b = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  if (a < 0 || b < a) throw new Error('AI 回覆不是 JSON 格式');
  return JSON.parse(t.slice(a, b + 1));
}
async function askAI(prompt, { tier = 'default', maxTokens = 6000 } = {}) {
  if (env.backendAI || (env.backend && userKey)) {
    const headers = { 'Content-Type': 'application/json' };
    if (userKey) headers['X-User-Api-Key'] = userKey;
    const d = await api('/api/ai', { method: 'POST', headers, body: JSON.stringify({ prompt, maxTokens }), timeout: 180000 });
    return parseJSON(d.text);
  }
  if (env.sample) {
    try { const { text } = await env.sample(prompt, { modelTier: tier }); return parseJSON(text); }
    catch (e) {
      const m = { not_granted: '你沒有允許此頁使用 Claude，AI 功能已停用。', rate_limited: 'Claude 使用次數暫時達到上限，請稍後再試。' };
      throw new Error(m[e.code] || e.message || 'AI 呼叫失敗');
    }
  }

async function analyze() {

      while (queue.length) {

        const data = batch.map(i => ({ id: i.id, brand: i.brand, type: TYPE[i.type], date: i.date ? i.date.slice(0, 10) : '', title: i.title, content: (i.text || i.summary || '').slice(0, 500) }));

- topic：議題分類，10 字以內（例如：新品發表、融資、財報、人事、合作、資安事件、客訴、活動行銷）
- keywords：2～4 個關鍵字
- reason：一句話，具體說明這篇與我方公司的比較或對我方的影響。只能根據文章內容，不可加入文章沒有的事實；資訊不足就寫「資訊不足」。
用繁體中文。只輸出 JSON：{"results":[{"id":"","level":"red|yellow|green","sentiment":"positive|neutral|negative","topic":"","keywords":[],"reason":""}]}
文章：${JSON.stringify(data)}`, { maxTokens: 8000 });
        for (const x of r.results || []) if (x && x.id && batch.some(i => i.id === x.id)) S.analysis[x.id] = {

      .map(i => ({ id: i.id, brand: i.brand, date: i.date ? i.date.slice(0, 10) : '', title: i.title, level: S.analysis[i.id].level, sentiment: S.analysis[i.id].sentiment, topic: S.analysis[i.id].topic, reason: S.analysis[i.id].reason }));

各品牌統計：${JSON.stringify(st.byBrand.map(b => ({ brand: b.name, self: !!b.self, total: b.total, news: b.types.news || 0, red: b.lv.red, yellow: b.lv.yellow, green: b.lv.green, positive: b.se.positive, neutral: b.se.neutral, negative: b.se.negative })))}

只輸出 JSON：{"overview":"3～5 句整體結論","actions":["給我方的具體建議，3～5 點"],"brands":[{"name":"品牌名（與統計中一致）","threat":"red|yellow|green","strengths":["主要優勢"],"issues":["問題或負面"],"events":[{"title":"事件","itemIds":["id"]}],"vsUs":"與我方的具體比較，1～2 句"}],"topics":[{"topic":"常見議題","brands":["品牌"],"note":"一句說明"}]}`, { tier: 'complex', maxTokens: 8000 });

function renderProgress4() { const p = $('#p4'); if (p) p.style.width = (prog4.total ? prog4.done / prog4.total * 100 : 0) + '%'; const t = $('#p4t'); if (t) t.textContent = `${prog4.label} ${prog4.done}/${prog4.total}`; }
function stats() {
  const items = S.items.filter(inDate);
  const byBrand = brands().map(b => {
    const its = items.filter(i => i.brand === b.name);
    const o = { name: b.name, self: b.self, total: its.length, types: {}, lv: { red: 0, yellow: 0, green: 0 }, se: { positive: 0, neutral: 0, negative: 0 }, analyzed: 0 };
    for (const i of its) {

    }
    return o;
  });
  const kw = {}, tp = {};
  for (const i of items) { const a = S.analysis[i.id]; if (!a) continue; for (const k of a.keywords) { const kk = k.trim(); if (kk) kw[kk] = (kw[kk] || 0) + 1; } if (a.topic) { tp[a.topic] = tp[a.topic] || { n: 0, brands: new Set() }; tp[a.topic].n++; tp[a.topic].brands.add(i.brand); } }

  const nAna = st.items.filter(i => S.analysis[i.id]).length;
  const R = S.report;
  const totalRed = st.byBrand.reduce((a, b) => a + b.lv.red, 0), totalNeg = st.byBrand.reduce((a, b) => a + b.se.negative, 0);
  const rb = name => (R && R.brands || []).find(x => x.name === name) || (R && R.brands || []).find(x => x.name && name && x.name.toLowerCase().includes(name.toLowerCase())) || null;
  const itemById = id => S.items.find(i => i.id === id);
  const lvBadge = l => l ? `<span class="lv ${l}">${LV[l]}</span>` : '<span class="lv none">未評級</span>';
  const maxNews = Math.max(1, ...st.byBrand.map(b => b.types.news || 0));
  const maxTot = Math.max(1, ...st.byBrand.map(b => b.total));
  const maxAna = Math.max(1, ...st.byBrand.map(b => b.analyzed));
  const typeCols = Object.keys(TYPE).filter(k => st.byBrand.some(b => b.types[k]));
  const rows = st.items.filter(i => (!filt4.brand || i.brand === filt4.brand) && (!filt4.level || (S.analysis[i.id] || {}).level === filt4.level) && (!filt4.sent || (S.analysis[i.id] || {}).sentiment === filt4.sent))
    .sort((a, b) => { const o = { red: 0, yellow: 1, green: 2 }; const la = o[(S.analysis[a.id] || {}).level] ?? 3, lb = o[(S.analysis[b.id] || {}).level] ?? 3; return la - lb || (Date.parse(b.date) || 0) - (Date.parse(a.date) || 0); });

  v.innerHTML = `<section class="panel" id="report">
    <div class="panel-head">
      <span class="mono small muted">COMPETITIVE BRIEF · ${S.from} ～ ${S.to}</span>
      <h2>${esc(S.company.name)} 競業輿情報告</h2>
      <p>比較對象：${brands().filter(b => !b.self).map(b => esc(b.name)).join('、')}。${S.reportAt ? '產生時間：' + new Date(S.reportAt).toLocaleString('zh-TW') + '。' : ''}所有統計僅來自步驟 3 實際蒐集或手動貼上的文章。</p>
    </div>
    ${!R || nAna < st.items.length ? `<div class="row"><button class="primary" id="b-analyze" ${busy4 || !aiReady() ? 'disabled' : ''}>${busy4 ? '<i class="spin"></i> <span id="p4t">分析中</span>' : R ? `分析新加入的 ${st.items.length - nAna} 篇並更新報告` : `用 AI 分析 ${st.items.length} 篇文章並產生報告`}</button>
      ${busy4 ? '<div class="progress" style="flex:1 1 200px"><i id="p4"></i></div>' : ''}</div>` : ''}
    ${!aiReady() && env.sampleChecked ? notice('warn', 'AI 尚未連接', '目前只能顯示文章數量與聲量統計；紅黃綠分級、正負面分類、關鍵字與競業簡報需要 AI。請啟動後端並設定 ANTHROPIC_API_KEY，或在「連線與 AI 設定」輸入 API Key。') : ''}
    ${err4 ? notice('err', 'AI 分析沒有完成', esc(err4) + (nAna ? `<br>已完成 ${nAna} 篇的判讀，再按一次會從中斷處繼續。` : '')) : ''}

    <div class="kpis">
      <div class="kpi"><div class="v">${st.items.length}</div><div class="l">文章總數（已去重）</div></div>
      <div class="kpi"><div class="v">${st.byBrand.length}</div><div class="l">品牌數（含我方）</div></div>
      <div class="kpi"><div class="v" style="color:var(--red)">${nAna ? totalRed : '—'}</div><div class="l">紅色・高度相關文章</div></div>
      <div class="kpi"><div class="v">${nAna ? Math.round(totalNeg / nAna * 100) + '%' : '—'}</div><div class="l">負面內容比例</div></div>
    </div>

    ${R ? `<div class="sec"><div class="sec-h"><span class="k">Brief</span><h3>競業簡報</h3></div>
      <div class="brief"><p>${esc(R.overview)}</p>${(R.actions || []).length ? `<div><b class="small">建議 ${esc(S.company.name)} 採取的行動</b><ul>${R.actions.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>` : ''}</div></div>` : ''}

    <div class="sec"><div class="sec-h"><span class="k">Risk</span><h3>紅綠燈分級總表</h3><span class="small muted">紅＝直接威脅我方產品或市場，黃＝需持續關注，綠＝低相關或機會</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>品牌</th><th>整體分級</th><th class="n">紅</th><th class="n">黃</th><th class="n">綠</th><th class="n">正面</th><th class="n">中立</th><th class="n">負面</th><th>與 ${esc(S.company.name)} 的比較</th></tr></thead><tbody>
      ${st.byBrand.map(b => { const x = rb(b.name); return `<tr><td><b>${esc(b.name)}</b>${b.self ? '<span class="self-mark">我方</span>' : ''}</td><td>${b.self ? '<span class="muted small">—</span>' : lvBadge(x && x.threat)}</td>
        <td class="n" style="color:var(--red)">${b.lv.red}</td><td class="n" style="color:var(--yellow)">${b.lv.yellow}</td><td class="n" style="color:var(--green)">${b.lv.green}</td>
        <td class="n">${b.se.positive}</td><td class="n">${b.se.neutral}</td><td class="n">${b.se.negative}</td><td class="small" style="min-width:220px">${esc(x ? x.vsUs : (b.analyzed ? '' : '尚未分析'))}</td></tr>`; }).join('')}
      </tbody></table></div></div>

    <div class="grid2">
      <div class="sec"><div class="sec-h"><span class="k">Volume</span><h3>各品牌新聞聲量</h3></div>
        ${hbar(st.byBrand.map(b => ({ name: b.name, n: b.types.news || 0 })), maxNews, [{ k: 'n', c: 'var(--accent)', l: '新聞' }])}
        <p class="small muted" style="margin:0">計算 RSS 新聞篇數（期間內、已去重）。</p></div>
      <div class="sec"><div class="sec-h"><span class="k">Sentiment</span><h3>正面／中立／負面</h3></div>
        ${nAna ? hbar(st.byBrand.map(b => ({ name: b.name, p: b.se.positive, u: b.se.neutral, g: b.se.negative })), maxAna, [{ k: 'p', c: 'var(--pos)', l: '正面' }, { k: 'u', c: 'var(--neu)', l: '中立' }, { k: 'g', c: 'var(--neg)', l: '負面' }])
          + '<div class="legend"><span><i style="background:var(--pos)"></i>正面</span><span><i style="background:var(--neu)"></i>中立</span><span><i style="background:var(--neg)"></i>負面</span></div>' : '<p class="muted small">需要 AI 分析後顯示。</p>'}</div>
    </div>

    <div class="sec"><div class="sec-h"><span class="k">Count</span><h3>各品牌文章數量</h3></div>
      <div class="tbl-wrap"><table><thead><tr><th>品牌</th>${typeCols.map(k => `<th class="n">${TYPE[k]}</th>`).join('')}<th class="n">合計</th><th style="width:35%">分布</th></tr></thead><tbody>
      ${st.byBrand.map(b => `<tr><td><b>${esc(b.name)}</b>${b.self ? '<span class="self-mark">我方</span>' : ''}</td>${typeCols.map(k => `<td class="n">${b.types[k] || 0}</td>`).join('')}<td class="n"><b>${b.total}</b></td>
        <td><div class="tr" style="height:10px;background:var(--surface-2);border-radius:4px;overflow:hidden"><i style="display:block;height:100%;width:${b.total / maxTot * 100}%;background:var(--accent)"></i></div></td></tr>`).join('')}
      </tbody></table></div></div>

    <div class="grid2">
      <div class="sec"><div class="sec-h"><span class="k">Keywords</span><h3>熱門關鍵字</h3></div>
        ${st.kw.length ? `<div class="kw">${st.kw.map(([k, n]) => `<span style="font-size:${(0.8 + Math.min(n, 8) * 0.06).toFixed(2)}rem">${esc(k)}<b>${n}</b></span>`).join('')}</div>` : '<p class="muted small">需要 AI 分析後顯示。</p>'}</div>
      <div class="sec"><div class="sec-h"><span class="k">Topics</span><h3>常見議題</h3></div>
        ${st.tp.length ? `<div class="tbl-wrap"><table><thead><tr><th>議題</th><th class="n">篇數</th><th>涉及品牌</th></tr></thead><tbody>
          ${st.tp.map(([t, o]) => { const note = (R && R.topics || []).find(x => x.topic === t); return `<tr><td>${esc(t)}${note ? `<div class="small muted">${esc(note.note)}</div>` : ''}</td><td class="n">${o.n}</td><td class="small">${[...o.brands].map(esc).join('、')}</td></tr>`; }).join('')}
        </tbody></table></div>` : '<p class="muted small">需要 AI 分析後顯示。</p>'}</div>
    </div>

    ${R ? `<div class="sec"><div class="sec-h"><span class="k">Brands</span><h3>各品牌優勢、問題與值得關注的事件</h3></div>
      <div class="bcards">${st.byBrand.map(b => { const x = rb(b.name); if (!x) return ''; return `<article class="bcard ${b.self ? '' : x.threat}">
        <div class="row" style="justify-content:space-between;align-items:center"><h3>${esc(b.name)}${b.self ? '<span class="self-mark">我方</span>' : ''}</h3>${b.self ? '' : lvBadge(x.threat)}</div>
        ${x.vsUs && !b.self ? `<div class="vs">${esc(x.vsUs)}</div>` : ''}
        ${(x.strengths || []).length ? `<div><h4>主要優勢</h4><ul>${x.strengths.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>` : ''}
        ${(x.issues || []).length ? `<div><h4>問題／負面</h4><ul>${x.issues.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>` : ''}
        ${(x.events || []).length ? `<div><h4>值得關注的事件</h4><ul>${x.events.map(e => `<li>${esc(e.title)} ${(e.itemIds || []).map(itemById).filter(Boolean).map((it, k) => link(it.url, `<sup>[${k + 1}]</sup>`)).join('')}</li>`).join('')}</ul></div>` : ''}
      </article>`; }).join('')}</div></div>` : ''}

    <div class="sec"><div class="sec-h"><span class="k">Detail</span><h3>文章明細</h3><span class="small muted">${rows.length} 篇</span></div>
      <div class="filters">
        <select id="f4-brand" aria-label="品牌"><option value="">全部品牌</option>${brands().map(b => `<option ${filt4.brand === b.name ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select>
        <select id="f4-level" aria-label="分級"><option value="">全部分級</option>${Object.entries(LV).map(([k, l]) => `<option value="${k}" ${filt4.level === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <select id="f4-sent" aria-label="情緒"><option value="">全部情緒</option>${Object.entries(SENT).map(([k, l]) => `<option value="${k}" ${filt4.sent === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <span style="flex:1"></span>
        <button class="sm" id="b-csv">下載 CSV</button><button class="sm" id="b-html">下載報告 HTML</button>
      </div>
      <div class="tbl-wrap"><table><thead><tr><th>分級</th><th>標題</th><th>品牌</th><th>情緒</th><th>議題</th><th>對我方的影響</th><th>來源／日期</th></tr></thead><tbody>
      ${rows.slice(0, 400).map(i => { const a = S.analysis[i.id] || {}; return `<tr><td>${a.level ? `<span class="lv ${a.level}">${LVs[a.level]}</span>` : '<span class="lv none">—</span>'}</td>
        <td class="title-cell" style="min-width:240px">${link(i.url, esc(i.title))}</td><td class="small">${esc(i.brand)}</td>
        <td>${a.sentiment ? `<span class="st ${a.sentiment}">${SENT[a.sentiment]}</span>` : '—'}</td><td class="small">${esc(a.topic || '')}</td>
        <td class="small" style="min-width:220px">${esc(a.reason || '')}</td><td class="small" style="white-space:nowrap">${esc(i.source)}<div class="mono muted">${fmtDate(i.date)}</div></td></tr>`; }).join('')}
      </tbody></table></div><div id="dl-msg" class="small muted"></div></div>
    <div class="actions"><button id="b-back4">← 回到蒐集資料</button>${R ? '<button id="b-rerun">重新產生報告</button>' : ''}</div>
  </section>`;
  renderProgress4();
  const ba = $('#b-analyze'); if (ba) ba.onclick = analyze;
  $('#f4-brand').onchange = e => { filt4.brand = e.target.value; render(); };
  $('#f4-level').onchange = e => { filt4.level = e.target.value; render(); };
  $('#f4-sent').onchange = e => { filt4.sent = e.target.value; render(); };
  $('#b-back4').onclick = () => go(3);
  const rr = $('#b-rerun'); if (rr) rr.onclick = () => { S.analysis = {}; S.report = null; save(); analyze(); };
  $('#b-csv').onclick = () => {
    const head = ['分級', '品牌', '標題', '網址', '來源', '日期', '類型', '情緒', '議題', '關鍵字', '對我方的影響'];
    const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
    const lines = [head.join(',')].concat(st.items.map(i => { const a = S.analysis[i.id] || {}; return [LVs[a.level] || '', i.brand, i.title, i.url, i.source, i.date ? i.date.slice(0, 10) : '', TYPE[i.type], SENT[a.sentiment] || '', a.topic || '', (a.keywords || []).join('、'), a.reason || ''].map(q).join(','); }));
    download(`${S.company.name}-競業輿情-${S.from}_${S.to}.csv`, '﻿' + lines.join('\r\n'), 'text/csv');
  };
  $('#b-html').onclick = () => {
    const css = document.querySelector('style').outerHTML;
    const body = $('#report').cloneNode(true); $$('button,select,.filters,.actions', body).forEach(x => x.remove());
    download(`${S.company.name}-競業輿情報告.html`, `<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(S.company.name)} 競業輿情報告</title>${css}</head><body><main class="wrap" style="padding-block:24px">${body.outerHTML}</main></body></html>`, 'text/html');
  };
}
async function download(filename, text, type) {
  const msg = $('#dl-msg');
  if (window.claude && claude.use) {
    try {
      const d = await claude.use('downloads');
      if (d) { await d.save({ filename, data: new Blob([text], { type }) }); if (msg) msg.textContent = '已下載 ' + filename; return; }
    } catch (e) { if (msg) msg.textContent = '下載未完成：' + (e.message || e.code || '已取消'); return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// ================= 設定 =================
$('#apikey').value = userKey;
$('#serperkey').value = serperKey;
$('#savekey').onclick = () => { userKey = $('#apikey').value.trim(); store.set('radar.key', userKey); serperKey = $('#serperkey').value.trim(); store.set('radar.serper', serperKey); renderEnv(); render(); };
let resetArmed = false;
$('#reset').onclick = e => {
  if (!resetArmed) { resetArmed = true; e.target.textContent = '再按一次確認清除'; setTimeout(() => { resetArmed = false; e.target.textContent = '清除全部資料重新開始'; }, 4000); return; }
  store.del('radar.state'); S = DEFAULT(); resetArmed = false; e.target.textContent = '清除全部資料重新開始'; render();
};

renderEnv(); render(); detect();
})();
</script>
